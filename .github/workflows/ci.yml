name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust workspace and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@87eb139fed4b08a67bd1fa429a21d1f5d523e03e # 1.92.0
        with:
          components: clippy,rustfmt
          targets: riscv64imac-unknown-none-elf

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            sdk/typescript/package-lock.json
            ui/morph-hub/package-lock.json

      - name: Cache cargo build outputs
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install supply-chain tools
        run: cargo install --locked cargo-audit cargo-deny

      - name: Check formatting
        run: make fmt-check

      - name: Run clippy
        run: make lint

      - name: Run supply-chain checks
        run: make supply-chain

      - name: Run workspace tests
        run: make test

      - name: Run fixture checks
        run: make fixture-checks

      - name: Check TypeScript SDK
        run: make sdk-check

      - name: Check Morph Hub UI
        run: make hub-ui-check

      - name: Run contract tests
        run: make contract-tests

      - name: Verify pre-production release boundary
        run: make release-readiness

      - name: Package contract release
        run: make package-contract-release

      - name: Upload contract release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: morph-contracts-${{ github.sha }}
          path: target/factory-v1.0-fixed-bilateral.tar.gz
          if-no-files-found: error
          retention-days: 30

  attest-contracts:
    name: Attest main-branch contract release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: rust
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download contract release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: morph-contracts-${{ github.sha }}
          path: target/attestation

      - name: Attest contract release provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: target/attestation/factory-v1.0-fixed-bilateral.tar.gz
