name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust workspace and contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy,rustfmt
          targets: riscv64imac-unknown-none-elf

      - name: Cache cargo build outputs
        uses: Swatinem/rust-cache@v2

      - name: Install supply-chain tools
        run: cargo install --locked cargo-audit cargo-deny

      - name: Check formatting
        run: make fmt-check

      - name: Run clippy
        run: make lint

      - name: Run supply-chain checks
        run: make supply-chain

      - name: Run workspace tests
        run: make test

      - name: Run fixture checks
        run: make fixture-checks

      - name: Run contract tests
        run: make contract-tests
