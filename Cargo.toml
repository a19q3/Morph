[workspace]
resolver = "2"
members = [
  "crates/morph-core",
  "crates/morph-cli",
  "crates/morph-agent",
  "crates/morph-fiber-adapter",
  "contracts/morph-script-common",
  "contracts/morph-state-lock",
  "contracts/morph-state-type",
  "contracts/morph-factory-type",
  "contracts/morph-factory-vault-lock",
  "contracts/morph-vault-lock",
  "contracts/morph-sponsor-lock",
  "contracts/morph-devnet-xudt",
]

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "MIT"
authors = ["Arthur Zhang"]
repository = "https://github.com/a19q3/Morph"
rust-version = "1.92.0"
description = "CKB-native off-chain channels, factories, and operator tooling"
readme = "README.md"

[workspace.dependencies]
anyhow = "1.0"
aes-gcm = "0.10"
axum = "0.8"
base64 = "0.22"
biscuit-auth = "6.0.0"
blake2b-rs = "0.2"
ckb-crypto = "1.1.0"
ckb-jsonrpc-types = "1.1.1"
ckb-types = "1.1.1"
clap = { version = "4.5", features = ["derive", "env"] }
hex = "0.4"
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
ckb-std = { version = "1.1.0", default-features = false, features = ["allocator", "calc-hash", "ckb-types", "dummy-atomic"] }
ckb-testtool = "1.1.1"
ckb-hash = { version = "1.1.0", default-features = false, features = ["ckb-contract"] }
k256 = { version = "0.13.4", default-features = false, features = ["ecdsa", "arithmetic"] }
proptest = "1"
rand = "0.8"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
