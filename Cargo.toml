[workspace]
resolver = "2"
members = [
  "crates/morph-core",
  "crates/morph-cli",
]

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["Arthur Zhang"]
repository = "https://github.com/a19q3/morph-channel"
rust-version = "1.92.0"

[workspace.dependencies]
anyhow = "1.0"
blake2b-rs = "0.2"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

