[workspace]
resolver = "2"
members = [
  "crates/morph-core",
  "crates/morph-cli",
  "contracts/morph-script-common",
  "contracts/morph-state-lock",
  "contracts/morph-state-type",
  "contracts/morph-factory-type",
  "contracts/morph-factory-vault-lock",
  "contracts/morph-vault-lock",
  "contracts/morph-sponsor-lock",
  "contracts/morph-devnet-xudt",
]

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["Arthur Zhang"]
repository = "https://github.com/a19q3/Morph"
rust-version = "1.92.0"

[workspace.dependencies]
anyhow = "1.0"
blake2b-rs = "0.2"
ckb-crypto = "1.1.0"
ckb-jsonrpc-types = "1.1.1"
ckb-types = "1.1.1"
clap = { version = "4.5", features = ["derive", "env"] }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
ckb-std = { version = "1.1.0", default-features = false, features = ["allocator", "calc-hash", "ckb-types", "dummy-atomic"] }
ckb-testtool = "1.1.1"
ckb-hash = { version = "1.1.0", default-features = false, features = ["ckb-contract"] }
k256 = { version = "0.13.4", default-features = false, features = ["ecdsa", "arithmetic"] }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
