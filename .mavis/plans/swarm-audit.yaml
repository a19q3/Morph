      1. **Cross-Track Finding Map 完整性**: 检查 W1-W5 + paper audit 报告里的 finding ID 是否全部出现在 map 里 (用 grep 检查每个上游报告里的 "W1-0X" / "W2-0X" / "W3-0X" / "W4-0X" / "W5-0X" / "S1-S5" / "M1-M8")。漏一个 = FAIL。
      2. **没有编造**: 抽样 5 个 finding,每个 finding 的引用必须能在对应上游报告里找到完全一致的描述。
      3. **主题分类合理性**: 至少 8 个主题 group,每个 group 至少 2 个 finding。
      4. **Decisions 部分**: 至少 3 个具体问题,每个有 2-3 个候选 + 推荐。
      5. **Recommendations 可执行性**: P0/P1/P2 至少各 3 条,每条有 owner 候选。
      6. **Executive Summary 长度 ≤ 200 字**,但包含 severity 总数 + maturity 评级 + 3 risks。

      PASS 标准: map 完整,无编造,主题覆盖,Decisions 具体,Recommendations 可执行。
      FAIL 标准: 漏掉任何上游 finding,编造 finding ID, 或 Recommendations 没有 owner。