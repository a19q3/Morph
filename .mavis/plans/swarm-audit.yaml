  - id: W6-synthesis
    title: 'W6 — 跨轨道综合审计报告 (final deliverable)'
    assigned_to: coder
    verified_by: verifier
    depends_on: [W1-code-security, W2-paper-code-crossref, W3-docs-consistency, W4-ops-acceptance, W5-tests-refresh]
    max_retries: 1
    prompt: |
      你是 morph-channel 最终综合审计员 (W6)。

      ## 起点
      5 条并行轨道已完成,你读它们的报告:
      - /Users/arthur/RustroverProjects/morph-channel/docs/swarm-audit-W1-code-security.md
      - /Users/arthur/RustroverProjects/morph-channel/docs/swarm-audit-W2-paper-code-crossref.md
      - /Users/arthur/RustroverProjects/morph-channel/docs/swarm-audit-W3-docs-consistency.md
      - /Users/arthur/RustroverProjects/morph-channel/docs/swarm-audit-W4-ops-acceptance.md
      - /Users/arthur/RustroverProjects/morph-channel/docs/swarm-audit-W5-tests-refresh.md

      以及独立论文审计:
      - /Users/arthur/RustroverProjects/Research-a19q3/morph_channel/docs/MORPH_INTERNAL_AUDIT_2026-06-21.md (paper.tex 内部)
      - /Users/arthur/RustroverProjects/Research-a19q3/morph_channel/docs/MORPH_PATCH_2026-06-22.md (S1-S5 修复方案)

      ## 你的任务 (single deliverable)
      写最终综合审计报告 `/Users/arthur/RustroverProjects/morph-channel/docs/swarm-audit-SYNTHESIS.md`,包含:

      ### 1. Executive Summary (1 段)
      - 总 finding 数 (按 severity)
      - 整体 maturity 评级 (devnet / pre-mainnet / mainnet)
      - 三个最重要的 risk (一句话 each)

      ### 2. Cross-Track Finding Map
      把 W1-W5 + paper audit (MORPH_INTERNAL_AUDIT) 全部 finding 列在一张大表,按:
      - Severity
      - Track (W1/W2/W3/W4/W5/Paper)
      - Finding ID
      - Surface (file:line)
      - 状态 (open / partially-closed / closed-by-PATCH / superseded)
      - 与其他 finding 的关联 (例如 W1 找到 X,Y,Z 三个 finding 都跟 audit-response C-01 有关 → 归到 "C-01 closure" 组)

      ### 3. 主题风险分类
      按主题而不是轨道分组:
      - **C-01 闭合情况**: audit-response C-01 的真正 close 状态 (结合 W5-01, W2 paper↔code, paper patch S3)
      - **SpliceHeader / payload_commitment 一致性**: W1 + W5 + W2 的相关 finding
      - **Schema drift (morph.mol vs Rust constants)**: W5-02 + W2 paper↔code
      - **Partition conservation 覆盖**: W1 + paper audit S3 + paper patch
      - **Audit-matrix test 引用是否真实**: W3 + W5-11
      - **Fiber Morph acceptance 证据链**: W4 + W3
      - **文档 superseded / maturity claim**: W3
      - **SettlementDescriptor / FUND_BOUNDS field drift**: W2 + paper audit S2 + paper patch
      - **Phase enum / state machine consistency**: W2 + paper audit S4/S5 + paper patch
      - **CI gate (build-contracts 顺序)**: W4 + W5-09/10
      - **property-based testing 缺失**: W5-03
      - **Watchtower authority / M-03**: 跨 W1 / W3 / W4 找相关
      - **Mainnet readiness gate**: W3 + audit-response
      - (其他主题你发现时新建)

      ### 4. Open Risks vs Closed Risks
      - **Open (高优先级,需立即处理)**: 列表
      - **Partially Closed (已有 patch/fix 但需要 follow-up)**: 列表,标记谁负责 follow-up (paper / code / doc)
      - **Closed (verified)**: 列表,引用 evidence

      ### 5. Recommendations (按优先级)
      - P0 (24 小时内): ...
      - P1 (1 周内): ...
      - P2 (1 月内): ...
      每条 recommendation 必须关联具体 finding ID 和建议的 owner (paper author / code maintainer / doc maintainer / ops)。

      ### 6. Decisions Needed from User
      列出需要用户决策的问题:
      - 例如: W5-01 提出 audit-response 文字与代码不一致 — 是否更新 audit-response 文字,还是补 code check?
      - 例如: W3 提到 docs/redundant-stale-code-audit.md 可能 superseded — 是否删?
      - 例如: W5-03 提到 proptest 缺失 — 是否引入?
      每条给 2-3 个具体候选方案 + 你的推荐 + 推荐理由。

      ### 7. Closing Note
      一段总结: 这次 swarm audit 的可信度等级 (high/medium/low) + 限制 (例如没跑 build/test runtime 验证, 没看 build artifact, 等) + 下次 audit 建议 (例如 proptest 引入后再审计一次, devnet acceptance 后再审计一次)。

      ## 规则
      - 必须引用每个上游报告,不能编造 finding。
      - 必须引用每个 finding 的 file:line 证据。
      - 不要重复完整 finding 内容;给出"finding ID + 1 行摘要 + 引用"即可。
      - 不要把 finding 从 paper 移到 code 或反之;保留原始来源。
      - 不要修改任何代码 / 文档;只写报告。

      ## 风格
      用 L2 protocol design 写作规范:
      - 明确区分 "architecture fit" 与 "production evidence"
      - 不要 dramatize
      - frozen ≠ audited (这个报告不声称"最终冻结",只声称"综合快照")

      回 root: 报告路径 + executive summary + 三个最 critical 的 risk + 三个需要 user decision 的问题。

