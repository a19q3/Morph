version: 1
plan:
  name: 'morph-channel 仓库 + thesis 交叉审计'
  max_concurrency: 6
  max_consecutive_failures: 2
  max_cycles: 6
  auto_reject_retries: 1
  verifier_config:
    default_verifiers: [verifier]
    audit_sample_rate: 0.0
tasks:
  # ---------- 并行五条独立审计轨道 ----------
  - id: W1-code-security
    title: 'W1 — CKB 合约 + Rust crate 实现层代码审计'
    assigned_to: coder
    verified_by: verifier
    max_retries: 2
    prompt: |
      你是 morph-channel 全仓库代码审计员 (W1)。交付一份独立的 markdown 审计报告。

      ## Scope
      - 主仓库: /Users/arthur/RustroverProjects/morph-channel (branch arthur/morph-audit-fixes, HEAD aa71651)
      - 目标: 8 个 CKB 合约 (contracts/morph-*)、2 个 Rust crate (crates/morph-core, crates/morph-cli)、schemas/。
      - 论文参考: /Users/arthur/RustroverProjects/Research-a19q3/morph_channel/paper.tex (2685 行),仅作为"是否实现"的交叉参考。
      - 已存在的 audit 文档: docs/audit-response-2026-06-20.md, docs/audit-matrix.md, docs/paper-implementation-audit.md, docs/generalized-audit.md, docs/redundant-stale-code-audit.md, docs/SECURITY-FIXES.md。
      - 已有 W5 报告: docs/swarm-audit-tests.md (tests/CI 角度,你不重复)。
      - 已有论文 patch: docs/MORPH_INTERNAL_AUDIT_2026-06-21.md + docs/MORPH_PATCH_2026-06-22.md。

      ## 你的角度 (W1 与已有审计正交)
      1. **正确性 / 安全不变量**: 8 个 CKB 合约的 main.rs (no_std) — 守恒检查是否真的覆盖每个 lane?有没有 lane 漏检或顺序 bug?
      2. **WitnessEnvelope dispatch**: morph-factory-type 的 envelope 解析、body_commitment、kind dispatch 是否有边界漏洞?(空 body / 超长 body / body_commitment 冲突)
      3. **密码学使用**: k256 ECDSA,blake2b,签名 digest domain separation,验证签名场景下的签名恢复、sighash_all 边界。
      4. **资源耗尽 / DoS**: witness 大小限制、循环步数、super-long input 数组的解包行为。
      5. **工厂 reduced-proof**: reduced-rights / reduced-exit / sparse-Merkle update / reduced-splice 的 fixture 与代码是否一致?有没有 fixture 容易构造但合约不挡的攻击面?
      6. **morph-cli**: 是否任何命令意外地允许未签名 publish / 任意 funding context id 替换 / watch config injection?
      7. **未引用代码**: dead code / 测试用但脚本层未用的导出 / 与 audit-matrix 声称不符的 helper。
      8. **CKB script 测试 (contract_scripts.rs) 覆盖**: 84 个 ignored test 都覆盖什么?有没有关键的 negative path 仍然没有 CKB-VM 验证?

      ## 必读
      - contracts/morph-script-common/src/lib.rs (~6855 行) — 共享 helper / digest / envelope 解析
      - contracts/morph-state-type/src/main.rs — state cell type 守门
      - contracts/morph-state-lock/src/main.rs — state lock
      - contracts/morph-vault-lock/src/main.rs — vault settlement
      - contracts/morph-sponsor-lock/src/main.rs — sponsor fee budget
      - contracts/morph-factory-type/src/main.rs — factory dispatch + reduced proofs
      - contracts/morph-factory-vault-lock/src/main.rs — factory reserve conservation
      - contracts/morph-devnet-xudt/src/main.rs — devnet xUDT issuer
      - crates/morph-core/src/{types.rs, validation.rs, hash.rs, ...}
      - crates/morph-cli/src/*.rs (devnet, watch, fixture, reports)
      - schemas/morph.mol

      ## 交付物
      在主仓库写 `docs/swarm-audit-W1-code-security.md`,格式:
      ```
      # Swarm Audit — W1 代码与安全 (Code & Security)
      Date: <today> Branch: arthur/morph-audit-fixes @ aa71651
      Severity counts: CRITICAL x / HIGH x / MEDIUM x / LOW x

      ## Findings
      ### W1-NN — <标题>
      **Severity**: CRITICAL/HIGH/MEDIUM/LOW
      **Surface**: <file:line>
      **Confidence**: high/medium/low
      **Claim**: ...
      **Evidence**: <引用具体 file:line + 代码片段>
      **Reproduction**: <命令或脚本,能在仓库内复现>
      **Impact**: ...
      **Suggested fix**: ...
      **References**: <引用 paper.tex 行号 / 已有 audit 文档>

      ## Cross-cutting observations
      ...

      ## Files reviewed
      - ...
      ```

      ## 规则
      - 不重复 W5 已写的内容(tests/CI)。如果 W5 的 finding 你认同并确认,引用而非重写。
      - 每个 finding 必须有 file:line 证据,且 Confidence 高。
      - **重要**: 论文已写 patch (docs/MORPH_PATCH_2026-06-22.md) 对 S1-S5 的修复,你**不要**重复这些;但要交叉检查 patch 是否影响合约层(paper.tex S3 改了 partition_conservation 调用名 → 合约层不需要改,因为合约是 Rust 不是 LaTeX)。
      - 不要改任何代码。只写报告。

      最后回 root: 报告路径 + severity 统计 + 三个最 critical 的 finding 摘要。
    verify_prompt: |
      你是 W1 的独立验证者。打开 /Users/arthur/RustroverProjects/morph-channel/docs/swarm-audit-W1-code-security.md。

      1. 随机挑 3 个 finding,逐个验证:
         - file:line 是否真实存在?
         - 引用代码片段是否与仓库一致? (用 Read 工具直接对比)
         - Reproduction 命令是否在当前仓库可执行?
      2. 检查 coverage: 报告是否覆盖 8 个合约 + 2 个 crate?有没有重要合约 (例如 morph-factory-type) 缺位?
      3. 检查与已有审计一致性: W5 的 W5-01 (state_context_matches_splice_next 不检查 payload_commitment) 是否在 W1 报告里被引用或处理?W5-02 (schema drift) 是否在 W1 报告里?
      4. 检查 Severity 分级合理性: CRITICAL 是否真的是资金/共识/守恒类的安全漏洞?MEDIUM 是否是 bug 不是 design 缺陷?

      PASS 标准: ≥ 80% 的抽样 finding 有真实证据,coverage 全,severity 分级合理,没有重复 W5。
      FAIL 标准: 任何抽样 finding 的 file:line 不存在或代码片段不一致。

      用 bash + Read 工具独立检查。在你的 cycle report 里写明 PASS/FAIL + 抽样细节。

  - id: W2-paper-code-crossref
    title: 'W2 — 论文 vs 实现 cross-reference'
    assigned_to: coder
    verified_by: verifier
    max_retries: 2
    prompt: |
      你是 morph-channel 论文 vs 代码 cross-reference 审计员 (W2)。

      ## Scope
      - 论文: /Users/arthur/RustroverProjects/Research-a19q3/morph_channel/paper.tex (2685 行, paper.pdf 是同一内容的 PDF)
      - 实现: /Users/arthur/RustroverProjects/morph-channel (HEAD aa71651)
      - 已有内部审计: docs/MORPH_INTERNAL_AUDIT_2026-06-21.md (5 substantive + 8 minor findings, paper.tex 自审)
      - 已有 patch: docs/MORPH_PATCH_2026-06-22.md (S1-S5 修复方案)
      - 已有实现侧 audit: docs/audit-response-2026-06-20.md, docs/paper-implementation-audit.md

      ## 你的角度 (W2 与 paper 内部审计正交)
      **paper.tex ↔ Rust 实现双向 cross-reference**:

      ### A. Paper 声称 → 代码实现
      对 paper.tex 中每个**结构性** claim (Definition / Theorem / Lemma / Section),检查代码里:
      1. 是否实现?
      2. 实现是否语义一致? (例如 paper S4 说 `Phase = {funding, active, settling, closed, factory_active}` 中 funding/closed 不进 StateHeader → 实际 Rust `Phase` enum 长什么样?代码里有没有显式注释?)
      3. paper 的 pseudo-code 字段名是否在 Rust struct 中存在? (例如 paper FUND_BOUNDS 引用 `descriptor.max_outputs`,Rust SettlementDescriptor 有没有这个字段?)
      4. paper 引用的 helper (例如 partition_conservation_for_publication) 在 Rust 里叫什么?是否真的参数化了 op?

      ### B. 代码实现 → paper 文档化
      对 Rust 代码中**所有**重大 invariant / 守恒规则,检查 paper.tex:
      1. 是否有对应 definition / theorem?
      2. 如果没有,这是 design 漏洞还是 paper 滞后?
      3. 代码里的命名 / 边界是否与 paper 一致? (例如 SpliceHeader 字段顺序、SettlementDescriptor 字段集)

      ### C. 概念一致
      1. paper Section 8 (factory) 与 contracts/morph-factory-type/ 的 reduced-* proof 名是否一一对应?
      2. paper TerminalReceipt 在代码里是哪个 type? (如果代码没写,这是 paper-only 概念,S1 已经标了)
      3. paper Partition conservation 的 lane 集合 (channel_reserve, business_ckb, xudt_balances, state_carrier, sponsor_capacity) 与 crates/morph-core/src/validation.rs 的 partition_conservation 实现是否 lane 一致?

      ## 必读
      - paper.tex 全文(重点: Definitions 段, StateCellType 段, FactorySection, Theorems)
      - crates/morph-core/src/types.rs (StateHeader, SettlementDescriptor, Phase, FundingContext, FactoryStateHeader 等)
      - crates/morph-core/src/validation.rs (partition_conservation, validate_state_transition, validate_factory_*)
      - contracts/morph-script-common/src/lib.rs (envelope, digest, helpers)
      - schemas/morph.mol (wire format)
      - contracts/morph-factory-type/src/main.rs (envelope dispatch, reduced proofs)
      - docs/MORPH_INTERNAL_AUDIT_2026-06-21.md (避免重复其 S1-S5)
      - docs/MORPH_PATCH_2026-06-22.md (理解 S1-S5 修复方向)

      ## 交付物
      写在主仓库 `docs/swarm-audit-W2-paper-code-crossref.md`:
      ```
      # Swarm Audit — W2 论文↔代码交叉引用
      Date: <today>
      Severity counts: CRITICAL x / HIGH x / MEDIUM x / LOW x

      ## A. Paper 声称 → 代码实现
      | Paper claim | paper.tex 行号 | 实现位置 | 状态 | 备注 |
      | --- | --- | --- | --- | --- |
      | ... | 312-318 | crates/morph-core/src/hash.rs:48 | OK / drift / missing | ... |

      (至少 25 行;按 Section 分组)

      ## B. 代码 invariant → paper 文档化
      | Rust invariant | 实现位置 | Paper 引用 | 状态 | 备注 |
      | --- | --- | --- | --- | --- |
      | ... | ... | ... | ... | ... |

      (至少 15 行)

      ## C. 概念不一致
      ...

      ## Findings (severity-ranked)
      ### W2-NN — <标题>
      **Severity**: ...
      **Surface**: paper.tex:NNN ↔ crates/.../xxx.rs:NN
      **Confidence**: ...
      **Claim**: ...
      **Evidence**: <两边引用>
      **Impact**: ...
      **Suggested fix**: <更新 paper / 更新代码 / 都更新>

      ## Cross-cutting
      ...

      ## Files reviewed
      ...
      ```

      ## 规则
      - 不要重复 W1 (代码安全) 或 W5 (tests/CI)。
      - MORPH_INTERNAL_AUDIT 已写 S1-S5 的,你不要重复。W2 应该**新增**实现层 vs paper 的 cross-ref 矩阵 + 新 finding。
      - 如果你发现新的 substantive finding (S 级),独立列出,不跟 M- 混。

      回 root: 报告路径 + A/B/C 矩阵大小 + 最重要的 3 个 finding 摘要。

    verify_prompt: |
      验证 W2 报告 (/Users/arthur/RustroverProjects/morph-channel/docs/swarm-audit-W2-paper-code-crossref.md)。

      1. 抽样 5 个 A 矩阵行: 每行验证 paper 行号真实存在(Read paper.tex 那一段)+ 代码路径真实存在(Read 代码)+ 状态描述 (OK/drift/missing) 是否合理。
      2. 抽样 3 个 B 矩阵行: 验证 Rust invariant 的 file:line 真实存在。
      3. 检查 Severity 分级: 是否覆盖真正的 paper↔code 概念不一致?还是只是 typo / 注释级别?
      4. 检查与已有审计一致性: 报告是否引用了 docs/MORPH_INTERNAL_AUDIT_2026-06-21.md 的 S1-S5?是否说明 W2 不重复它们?
      5. 至少 25 行 A 矩阵 + 15 行 B 矩阵,否则 coverage 不足。

      PASS 标准: 抽样 file:line 100% 真实,Severity 合理,coverage 达标,没有重复 paper 内部审计。
      FAIL 标准: 任何抽样 file:line 不存在,矩阵行数不足,或 finding 都是 paper typo 级别(应是 substantive drift)。

  - id: W3-docs-consistency
    title: 'W3 — Docs 一致性 / 范围 / 主张边界'
    assigned_to: coder
    verified_by: verifier
    max_retries: 2
    prompt: |
      你是 morph-channel 文档审计员 (W3)。

      ## Scope
      - 主仓库 docs/ 共 24 个 md 文件。
      - 重点: README.md, docs/mainnet-readiness.md, docs/roadmap.md, docs/devnet.md, docs/implementation.md, docs/morph-channel-tutorial.md + .zh.md, docs/generalized-audit.md, docs/redundant-stale-code-audit.md, docs/audit-matrix.md, docs/audit-response-2026-06-20.md, docs/paper-implementation-audit.md, docs/fiber-*.md, docs/devnet-*-closeout.md, docs/m5-closeout.md, docs/m6-closeout.md, docs/current-devnet-rc-closeout.md。
      - 已有 audit 不重复: W1 (代码), W2 (paper↔code), W5 (tests/CI)。

      ## 你的角度 (W3 与已有审计正交)
      1. **README ↔ docs/mainnet-readiness.md ↔ docs/roadmap.md 内部一致**: 项目是否同时声称 "devnet only" 和暗示接近生产?README "Maturity" 段 vs mainnet-readiness 的 "Open gates" 是否一致?
      2. **Audit 文档的 superseded 边界**: docs/audit-matrix.md, docs/audit-response-2026-06-20.md, docs/paper-implementation-audit.md, docs/generalized-audit.md, docs/redundant-stale-code-audit.md 之间的关系 — 哪个是 current?哪个被 supersede?有没有 audit 文档自称"current"但实际指向旧 commit?
      3. **Closeout 文档群**: docs/m5-closeout.md, docs/m6-closeout.md, docs/current-devnet-rc-closeout.md, docs/devnet-stateful-acceptance-closeout.md — 哪些是真的 close?哪些是 in-progress?有没有里程碑已被 close 但代码尚未 ship?
      4. **Tutorial 与 implementation 的一致性**: docs/morph-channel-tutorial.md / .zh.md 与 docs/implementation.md 描述的 protocol 行为是否一致?中文版是否落后英文版?
      5. **Audit-response 与 audit-matrix 的 evidence 数量声明**: audit-response §"Implementation evidence" 声称 248 tests pass、12 findings close、84 contract_scripts ignored 等。这些数字与 docs/swarm-audit-tests.md (W5) 的实际数字是否一致?如果不一致是 drift。
      6. **Fiber Morph 文档族**: docs/fiber-integration-plan.md, docs/fiber-morph-devnet-acceptance.md, docs/fiber-morph-devnet-runbook.md — 是否描述了一致的 acceptance gate?有没有 acceptance criteria 在 plan 里写但 runbook 没体现?
      7. **README "Implemented" 列表 ↔ 实际代码/测试覆盖**: README 列出 bilateral channels / xUDT / splice / watchtower / factory / reduced-* — 每一项的真实测试覆盖是什么?
      8. **roadmap.md 与 git log 真实历史一致**: roadmap 声称哪些里程碑已 close?git log 是否印证?

      ## 必读
      - README.md, docs/mainnet-readiness.md, docs/roadmap.md (核心一致性 hub)
      - docs/audit-matrix.md (audit 总览)
      - docs/audit-response-2026-06-20.md (上次审计的官方回应)
      - docs/swarm-audit-tests.md (W5 报告,你引用而非重写)
      - docs/paper-implementation-audit.md
      - docs/generalized-audit.md
      - docs/redundant-stale-code-audit.md
      - docs/fiber-morph-devnet-acceptance.md, docs/fiber-morph-devnet-runbook.md, docs/fiber-integration-plan.md
      - docs/devnet-stateful-acceptance-closeout.md, docs/current-devnet-rc-closeout.md, docs/m5-closeout.md, docs/m6-closeout.md
      - docs/morph-channel-tutorial.md + .zh.md, docs/implementation.md
      - docs/devnet.md

      ## 交付物
      写在主仓库 `docs/swarm-audit-W3-docs-consistency.md`:
      ```
      # Swarm Audit — W3 文档一致性与范围
      Date: <today>
      Severity counts: HIGH x / MEDIUM x / LOW x

      ## 1. 范围与成熟度声明 (README ↔ mainnet-readiness ↔ roadmap)
      ...

      ## 2. Audit 文档族 superseded 关系图
      (画或文字描述: 哪个 audit 文档被哪个 supersede,谁是 current)
      ...

      ## 3. Closeout 文档真实状态
      | 文档 | 自称状态 | 实际状态 (基于 git log / code) | drift |
      | --- | --- | --- | --- |
      | ... | ... | ... | ... |

      ## 4. Tutorial ↔ implementation 一致性
      ...

      ## 5. Audit-response 数字声明 vs 实际
      | audit-response 声称 | W5 实际数字 | 一致? |
      | --- | --- | --- |
      | 248 tests pass | ... | ... |

      ## 6. Fiber Morph 文档一致性
      ...

      ## 7. README "Implemented" 列表 ↔ 真实覆盖
      ...

      ## Findings
      ### W3-NN — <标题>
      **Severity**: HIGH/MEDIUM/LOW
      **Surface**: docs/<file>.md:NN
      **Confidence**: ...
      **Claim**: ...
      **Evidence**: <引用多个文档 + git log>
      **Impact**: ...
      **Suggested fix**: ...

      ## Cross-cutting
      ...

      ## Files reviewed
      ...
      ```

      ## 规则
      - 不要重复 W1/W2/W5。
      - W3 不需要写 CRITICAL (你的领域几乎不会有资金/共识/守恒级别漏洞),但 HIGH 应该有 — 文档声称的不一致会让用户误判 maturity。
      - 引用 git log 用 `git -C /Users/arthur/RustroverProjects/morph-channel log --oneline` 验证里程碑是否真实 close。
      - 不改文档,只写报告。

      回 root: 报告路径 + 文档 superseded 关系图 + 最重要的 3 个 finding。

    verify_prompt: |
      验证 W3 报告 (/Users/arthur/RustroverProjects/morph-channel/docs/swarm-audit-W3-docs-consistency.md)。

      1. 抽样 3 个 finding: 每个 finding 至少引用 2 个文档 file:line,验证两边内容确实不一致或确实有 drift。
      2. 验证"Closeout 真实状态"表: 至少抽样 2 行,git log 查该 milestone 的 commit 是否真存在。
      3. 验证"audit-response 数字声明 vs 实际"表: 至少抽样 2 个数字声明,在 docs/swarm-audit-tests.md 中找到对应数字,确认一致或标注 drift。
      4. 检查 superseded 关系图: 是否每个 audit 文档都有明确状态(current / superseded-by-X / drift)?

      PASS 标准: 抽样证据真实,表格至少填一半以上,superseded 关系明确。
      FAIL 标准: 抽样 finding 证据不实,或表格大量空缺,或 superseded 关系混乱。

  - id: W4-ops-acceptance
    title: 'W4 — 运维 / Acceptance / Scripts 一致性'
    assigned_to: coder
    verified_by: verifier
    max_retries: 2
    prompt: |
      你是 morph-channel 运维 / acceptance / scripts 审计员 (W4)。

      ## Scope
      - scripts/: 8 个 .sh (check-devnet-env.sh, devnet-e2e.sh, devnet-node.sh, devnet-smoke.sh, devnet-stateful-e2e.sh, devnet-stateful-scenarios.sh, fiber-morph-devnet-acceptance.sh, fiber-morph-devnet-audit.sh)
      - Makefile (113 行)
      - 文档: docs/devnet.md, docs/fiber-morph-devnet-acceptance.md, docs/fiber-morph-devnet-runbook.md, docs/devnet-stateful-acceptance-closeout.md, docs/current-devnet-rc-closeout.md
      - 已有 audit: docs/audit-response-2026-06-20.md, docs/swarm-audit-tests.md (W5), docs/audit-matrix.md

      ## 你的角度 (W4 与 W1/W3/W5 正交)
      1. **Acceptance gate 与 audit-matrix 的一致性**: docs/audit-matrix.md 列出 "248 tests pass + 84 contract_scripts" 等 gate,Makefile + scripts 实际跑的是哪一组?哪个 gate claim 没有对应 script?
      2. **Scripts 自身健壮性**: 重试逻辑、清理、端口检测、错误传递、stack teardown (commits fa8cd68, 22474b1, 0f1e2ca, dadf8b5 等)。有没有 retry-loop 死循环 / 静默吞错 / 退出码不一致?
      3. **Runbook ↔ script 一致**: docs/fiber-morph-devnet-runbook.md 步骤是否与 scripts/fiber-morph-devnet-acceptance.sh 实际行为一致?Runbook 是否漏掉 acceptance step?
      4. **devnet-stateful scenarios 覆盖**: docs/devnet-stateful-acceptance-closeout.md 列的 scenarios 实际由哪些 script step 触发?
      5. **Budget JSON 文件**: docs/devnet-smoke-budget.example.json, docs/devnet-stateful-budget.example.json, docs/devnet-audit-profile.example.json — 字段是否真的被对应 script 读?有没有 dead config?
      6. **Makefile target 可达性**: 每个 target 内部依赖是否真的能跑?是否依赖未在 repo 内提供的工具 (例如 ckb-cli, fiber)?
