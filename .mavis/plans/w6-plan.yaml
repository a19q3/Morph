version: 1
plan:
  name: 'morph-channel W6 协议架构三轴审计'
  max_concurrency: 4
  max_consecutive_failures: 2
  max_cycles: 8
  auto_reject_retries: 1
  verifier_config:
    default_verifiers: [verifier]
    audit_sample_rate: 0.0
tasks:
  # ---- 轴 1: 严密 (Rigor) — 形式正确性、不变量覆盖、状态机完整性 ----
  - id: w6-rigor
    title: 'W6-RIGOR: 协议严密性审计'
    assigned_to: coder
    verified_by: verifier
    max_retries: 2
    prompt: |
      工作目录: /Users/arthur/RustroverProjects/morph-channel
      基线 HEAD: 5072d81eddeb9a754d2a5a08f2e335fd7e12775f (commit: "fix splice payload binding audit gaps")
      工作树当前是 dirty,有若干未提交改动;审计以 HEAD 为准,worktree dirty 文件可作为旁证但不作判定依据。

      ## 任务
      对 morph-channel 整套协议架构做一次"严密 (rigor)"轴的独立审计。
      严密 = 形式正确性、不变量覆盖、状态机完整性、签名域隔离、边界条件。

      ## 不要重复的工作 (必须先读,再开始)
      - docs/swarm-audit-SYNTHESIS.md (W1-W5 综合)
      - docs/swarm-audit-W1-code-security.md (W1 详细)
      - docs/swarm-audit-W5-remediation.md + docs/swarm-audit-W5-tests-refresh.md
      - docs/audit-report-2026-06-27.md (6/27 重新核查)
      - docs/audit-matrix.md (执行不变量矩阵)

      这些里已关闭 (closed) 的 finding,本次 W6 只在它们"被新提交回退/削弱/旁路"时才重新列入;否则不要重复。

      ## 重点审计方向
      1. **签名域 (signing domains)**: 所有 domain string 是否在代码、paper、schema 三处一致?
         检查 crates/morph-core/src/hash.rs、contracts/morph-script-common/src/lib.rs 中所有
         *_DOMAIN 常量;核对是否有过期/重复/碰撞风险。
      2. **状态机完整性**: bilateral channel 全状态转换(open/publish/supersede/finalise/splice-in/splice-out)
         是否每条转换都有对应不变量?factory 状态机(initial/reduced-rights/exit/splice)是否每条转换
         都有对应不变量?Reduced paths 是否穷举?
      3. **不变量闭环**: 读取 crates/morph-core/tests/invariants.rs (或当前等价的测试文件);
         列出 paper/设计文档中声明的不变量,但代码层 (host-side 或 script-side) 缺失覆盖的项。
      4. **WitnessEnvelope 结构严密性**: contracts/morph-script-common/src/lib.rs 中 envelope 的
         kind dispatch、body commitment、长度边界、kind/body 一致性检查是否完备。
      5. **Splice 绑定 (post-W5 closure)**: state_context_matches_splice_next 现在绑定哪些字段?
         是否覆盖 funding_epoch、payload_commitment、new_payload_commitment、vault_set_commitment、
         new_vault_set_commitment 全集?还有哪些"在 splice 时变化但应被绑定"的字段?
      6. **Factory 非干扰 (non-interference)**: reduced-rights / reduced-exit 是否严格证明
         "touched 集合外的不变量保持"?阅读 contracts/morph-factory-type/src/main.rs 和
         contracts/morph-factory-vault-lock/src/main.rs。
      7. **Host-side vs Script-side 漂移**: crates/morph-core/src/validation.rs 中验证函数与
         contracts/*/src/main.rs 的实际校验逻辑是否完全对齐?有无"host 接受、script 拒绝"或
         反之的不对称?
      8. **Edge cases**: state_number = 0 首次发布、funding_epoch 切换、ChannelClosed 后
         witness 复用、sponsor policy expiry 边界、xUDT amount = 0 的 typed-change 是否处理。

      ## 必读文件 (建议路径,实际以仓库为准)
      - crates/morph-core/src/hash.rs
      - crates/morph-core/src/types.rs
      - crates/morph-core/src/validation.rs
      - crates/morph-core/tests/invariants.rs
      - contracts/morph-state-type/src/main.rs
      - contracts/morph-state-lock/src/main.rs
      - contracts/morph-vault-lock/src/main.rs
      - contracts/morph-sponsor-lock/src/main.rs
      - contracts/morph-factory-type/src/main.rs
      - contracts/morph-factory-vault-lock/src/main.rs
      - contracts/morph-script-common/src/lib.rs
      - schemas/morph.mol
      - docs/implementation.md

      ## 输出文件
      docs/swarm-audit-W6-rigor.md

      ## 输出格式
      1. 顶部元数据 (Date / Branch / HEAD / Auditors / Scope)
      2. Executive Summary (3-5 句,说明严密度评级)
      3. Findings 表 (Markdown table): | Sev | ID | Theme | Evidence (file:line) | Recommendation |
         - Sev: CRITICAL / HIGH / MEDIUM / LOW / INFO
         - ID: W6-RIGOR-NN (从 01 开始)
         - Theme: 一句话主题
         - Evidence: 必须含 file:line,真实可追溯
         - Recommendation: 一句话建议 (可由 code-maintainer / paper-author / doc-maintainer / ops 之一执行)
      4. Closed/Reused Findings: 引用 W1-W5 已关闭 finding 中本次重新发现或确认的项 (≤ 5 条)
      5. Rigor Coverage Matrix: 不变量 × 覆盖位置 (host / script / test) 矩阵
      6. Limitations: 本次审计的盲区 (e.g. 未跑 cargo test、未运行 RISC-V contract-tests、未执行
         `make devnet-stateful-e2e`)
      7. Recommended Next Triggers: 哪些事件之后应该重跑本审计

      ## 停止条件
      - docs/swarm-audit-W6-rigor.md 已写入
      - 文件结构包含以上 7 个章节
      - Executive Summary 第一句明确给出严密度评级 (建议: devnet-acceptable / devnet-research-only /
        not-yet-acceptable 三档)
      - Findings 表中至少 8 条新增 finding (不计入 Closed/Reused)
      - 然后用一句中文向用户报告完成 (在最终消息中说明: 找到 N 条新 finding / 严重度分布 / 建议)

    verify_prompt: |
      工作目录: /Users/arthur/RustroverProjects/morph-channel
      基线 HEAD: 5072d81eddeb9a754d2a5a08f2e335fd7e12775f

      独立复核 W6-RIGOR 的产出 docs/swarm-audit-W6-rigor.md。要求做以下事:

      1. **文件存在性 + 结构**: 验证文件存在;含 7 个必需章节;Executive Summary 第一句给出
         严密度评级;Findings 表 ≥ 8 条;含 Closed/Reused 段;含 Limitations 段。
      2. **file:line 真实性**: 抽取 Findings 表中前 5 条 Evidence,实际打开对应 file:line
         验证文中所述代码/逻辑确实存在。如果 ≥ 2 处 file:line 不真实,FAIL。
      3. **遗漏检查**: 至少重新覆盖以下 4 个角度,确认 auditor 没有遗漏明显问题:
         - 签名域字符串在 hash.rs / script-common / paper 三处的一致性
         - splice 时 funding_epoch +1 强制的 script-side 实现
         - state_number = 0 首次发布路径
         - factory reduced-exit 的 state_root 一致性
         如果在这 4 个角度中发现 auditor 完全没覆盖 ≥ 2 个,FAIL。
      4. **严重度校准**: 与 W1-W5 + 6/27 已关闭 finding 的严重度分布对比,如果 W6-RIGOR 把一个
         已被前序关闭的 finding 重新列为 CRITICAL 且未提供"为何重列"理由,FAIL。
      5. **可执行性**: 抽样 2 条 Recommendation,判断其能否在不破坏现有不变量测试的前提下被
         实现 (≥ 1 条被认为不可执行,FAIL)。

      输出格式:
      - 一段 PASS / FAIL 总结
      - 列出每项检查的结果 (✓ / ✗)
      - 若 FAIL: 具体列出需要修正的 finding ID 和缺失点

  # ---- 轴 2: 合理 (Reasonable) — 设计原理、选择是否有正当理由 ----
  - id: w6-reasonable
    title: 'W6-REASONABLE: 设计合理性审计'
    assigned_to: coder
    verified_by: verifier
    max_retries: 2
    prompt: |
      工作目录: /Users/arthur/RustroverProjects/morph-channel
      基线 HEAD: 5072d81eddeb9a754d2a5a08f2e335fd7e12775f
      工作树当前是 dirty;审计以 HEAD 为准。

      ## 任务
      对 morph-channel 整套协议架构做一次"合理 (reasonableness)"轴的独立审计。
      合理 = 设计选择是否有正当理由、是否符合"无更简单的等价设计"原则、是否与声明的目标
      (轻量、可分性、可证伪) 一致。

      这是一篇"设计评论",不是 bug hunt。允许出现 Reasonable / Better-alternative /
      Over-engineered / Under-justified / Mismatched-claim 等标签。

      ## 不要重复的工作
      同 W6-RIGOR 的 prior art 列表 (W1-W5 SYNTHESIS、6/27、audit-matrix)。本轴尤其关注:
      - 之前 audit 中**没有专门做设计原理审视**的盲区 (W1-W5 主要在 code/paper 同步、威胁、
        docs、ops、test refresh 上;没有一次纯粹的"设计选择是否有更好等价"审计)。

      ## 重点审计方向
      1. **Cell 模型选择**: 为什么用 StateCell + VaultCell + SponsorCell 三件套而不是
         单 cell 或双 cell?为什么 state 不持有 value?该分离是否过度?
      2. **StateHeader 字段集合**: 当前 StateHeader 字段(epoch, vault_set_commitment,
         funding_anchor, payload_commitment, ...) 是否每个都"签名 → 不可绕过 → 必要"?
         有没有"可推导但不签名"的字段?
      3. **WitnessEnvelope vs 老式 fixed witness**: 用 envelope 路由 7 种 kind 是不是最好的
         抽象?有没有更简洁的方案 (e.g. union<MorphOp> 直接序列化)?
      4. **Reduced factory paths**: 减少签字 (reduced-rights / reduced-exit / splice) 的
         设计哲学是什么?它对"全签字路径"提供了什么额外保证?还是只是性能优化?
      5. **Sponsor policy 模型**: 当前 SponsorPolicy 的字段 (min_state_number、
         max_state_number、max_fee_per_tx、expiry、allows_explicit_sponsor) 是否都是必要的?
         expiry 用 u64::MAX 当 forever 是否合理?
      6. **ChannelClose 路径**: 现在有没有"友好关闭"路径?靠 splice-out + finalise 是不是隐含
         一个"关闭"语义但没有显式命名?
      7. **Factory 退出语义**: factory local exit 把 child-channel materialise 出来,这是不是
         该协议的"实例化操作"?它跟"打开新通道"路径有没有本质重复?
      8. **文档↔实现对齐**: README 说的"the vault protects user value; the state cell says
         which state can settle that value; sponsor funds pay for publication" — 实际代码是否
         严格遵守这三句话?有没有"sponsor 偶然也承担 value 保管"或"state cell 也包含 vault
         语义"的隐含越界?
      9. **协议命名一致性**: Cell 命名 / 字段命名 / 脚本命名 / CLI 命名 / paper 命名是否
         五处一致?不一致的地方是"历史包袱"还是"概念混淆"?
      10. **Claim 校准**: README "Implemented locally" 列出的 8 项与 docs/roadmap.md 的 milestone
         是否一致?README "Still not claimed" 6 项与 docs/mainnet-readiness.md 是否一致?

      ## 必读文件
      - README.md (整篇)
      - docs/implementation.md
      - docs/roadmap.md
      - docs/mainnet-readiness.md
      - docs/morph-channel-tutorial.md (英文教程,看对外解释)
      - docs/morph-channel-tutorial.zh.md (中文教程,看对外解释)
      - crates/morph-core/src/types.rs (类型命名、字段命名)
      - schemas/morph.mol (wire-level 命名)
      - contracts/morph-state-type/src/main.rs (脚本命名 + 抽象)
      - contracts/morph-vault-lock/src/main.rs
      - contracts/morph-factory-type/src/main.rs
      - contracts/morph-sponsor-lock/src/main.rs
      - contracts/morph-script-common/src/lib.rs
      - paper.tex 如果在仓库内;不在则跳过 paper 对照(标记为 limitation)

      ## 输出文件
      docs/swarm-audit-W6-reasonable.md

      ## 输出格式
      1. 元数据
      2. Executive Summary: 给设计合理性一个评级 (Coherent / Partially-coherent /
         Internally-conflicted 三档),说明最关键的设计张力
      3. Design Review 表格: | ID | Surface | Claim/Choice | Question Raised | Verdict |
         - Verdict: Justified / Over-engineered / Under-justified / Better-alternative /
           Mismatched-claim / Naming-drift
         - 至少 12 条 review 记录
      4. Naming Drift 表: 同一概念在不同位置的不同命名 (代码/script/schema/paper/doc)
         ≥ 5 条
      5. Claim Calibration 表: README/roadmap/tutorial 三处声称与实现/roadmap/mainnet-readiness
         对照 ≥ 6 条
      6. Recommendations: 5 条以内的"如果做 v2,这 5 件事最重要"
      7. Limitations

      ## 停止条件
      - docs/swarm-audit-W6-reasonable.md 已写入
      - 至少 12 条 Design Review 记录
      - 至少 5 条 Naming Drift
      - 至少 6 条 Claim Calibration
      - Executive Summary 明确给出合理性评级
      - 然后向用户报告完成

    verify_prompt: |
      工作目录: /Users/arthur/RustroverProjects/morph-channel
      基线 HEAD: 5072d81eddeb9a754d2a5a08f2e335fd7e12775f

      独立复核 W6-REASONABLE 的产出 docs/swarm-audit-W6-reasonable.md。要求:

      1. **结构 + 数量**: 7 个必需章节齐备;Design Review ≥ 12 条;Naming Drift ≥ 5 条;
         Claim Calibration ≥ 6 条。
      2. **设计评论深度**: 抽样 3 条 Design Review,判断每条是否提出了"为什么这是个选择"+"有没有
         更简单的等价"两层论证。仅复述代码行为不算 review (≥ 2 条属于复述 → FAIL)。
      3. **Claim Calibration 真实性**: 抽样 2 条 Claim Calibration,实际打开 README.md 和
         docs/roadmap.md 对照,确认 auditor 所述的"声称"真实存在、"实现"真实存在。
      4. **Naming Drift 真实性**: 抽样 2 条 Naming Drift,在代码/schema/doc 三处 grep
         验证 auditor 所述的命名差异。
      5. **避免人身/项目历史**: 不应出现对 CKB、Polyjuice、Godwoken 等其他项目的批判性叙述;
         不应出现"前几次 audit 没发现..."之类的过程性叙述。出现即 FAIL。
      6. **可执行性**: 5 条 Recommendations 至少 3 条可在 1 周内由单人完成。

      输出 PASS / FAIL + 每项 ✓ / ✗。

  # ---- 轴 3: 安全 (Safety) — 威胁模型、攻击面、剩余漏洞 ----
  - id: w6-safety
    title: 'W6-SAFETY: 威胁模型与剩余风险审计'
    assigned_to: coder
    verified_by: verifier
    max_retries: 2
    prompt: |
      工作目录: /Users/arthur/RustroverProjects/morph-channel
      基线 HEAD: 5072d81eddeb9a754d2a5a08f2e335fd7e12775f
      工作树当前是 dirty;审计以 HEAD 为准。

      ## 任务
      对 morph-channel 整套协议架构做一次"安全 (safety)"轴的独立审计。
      安全 = 威胁模型显式化、攻击面穷举、剩余漏洞识别、信任假设清单、post-W5-closure 复核。

      ## 不要重复的工作
      同前两轴的 prior art。重点关注:
      - W1 (code/security) 是当时 (commit aa71651, 6/22) 的快照;现在 HEAD 5072d81 已 +
        W5 splice binding fix。需要重新看 W1-01 (sponsor first-publication) 等是否真的关闭。
      - 6/27 audit-report 已关闭的 finding 是否真的关闭?有没有"修复了但引入了新漏洞"?

      ## 重点审计方向
      1. **威胁模型显式化**: 当前协议有哪些信任假设?(脚本代码正确、参与者私钥安全、
         CKB L1 不可篡改、监控者诚实但可能掉线、...) 有没有未声明的隐含假设?
      2. **攻击面穷举**: 列出每条协议路径 (open / update / publish / supersede / finalise /
         splice-in / splice-out / sponsor top-up / watchtower / factory create / factory
         reduced-rights / factory reduced-exit / factory splice) 的攻击面:
         - 谁能发起?
         - 谁能干预?
         - 谁能抢先 (front-run)?
         - 谁能审查 (censor)?
         - 谁可以离线/掉线造成损害?
      3. **post-W5 closure 复核**:
         - W1-01 sponsor first-publication bypass: 当前 morph-sponsor-lock/src/main.rs:142-145
           是否真的要求 matching input StateCell + funding_anchor 匹配?有没有"devnet profile
           放宽"导致旁路仍在?
         - C-01 splice binding: 当前 state_context_matches_splice_next 是否绑定 payload_commitment
           + new_payload_commitment?vault_lock 是否同时绑定?
         - A-2026-06-27-04 Fiber 接受路径: scripts/fiber-morph-devnet-acceptance.sh:607-623
           是否传了 audit + budget profile?Dirty worktree 改动后这个 file 还正确吗?
      4. **新增威胁** (W1-W5 之后才出现的代码改动):
         - 看 git log 5072d81 之后到 dirty 之前的提交,以及 dirty 改动里有没有引入新的威胁面?
         - ui/morph-hub 的 auth token / CORS / state restore 改动是否引入新风险?
         - crates/morph-cli/src/hub.rs 的改动是否引入了 hub-server 攻击面?
      5. **CKB 共识层假设**: 协议假设 CKB 提供什么?如果 CKB 重组 / 叔块 / 长时间 finality 延迟
         会发生什么?
      6. **离线/掉线场景**: 参与者/监视塔/工厂成员长期离线对协议安全的影响?
         "challenge period" 是哪个字段?有没有被绕过?
      7. **签名密钥生命周期**: 通道关闭后参与者私钥还能不能签发新 state?(应该是不能,
         但要确认。) 工厂成员私钥退出后是否还能签发 reduced-exit?(应该是不能。)
      8. **Sponsor 经济攻击**: 能不能通过反复发空 state 包耗尽 sponsor budget?
         min_state_number/max_state_number 区间是否过宽?
      9. **脚本 (CKB-VM) 侧信道**: contracts/* 中的 Box::leak / syscalls / 不确定行为 /
         cycle 耗尽攻击面?W1-07 (Box::leak in morph-factory-vault-lock/src/main.rs:170) 是否关闭?
      10. **残余 HIGH/CRITICAL 重评估**: W1-W5 中所有未关闭 (open / partially-closed) 的 HIGH
          和 CRITICAL,本次重新评估严重度。

      ## 必读文件
      同 W6-RIGOR 的代码文件清单,加上:
      - docs/swarm-audit-W1-code-security.md
      - docs/swarm-audit-W5-remediation.md
      - docs/audit-report-2026-06-27.md
      - contracts/morph-sponsor-lock/src/main.rs (post-fix 状态)
      - contracts/morph-script-common/src/lib.rs 中 state_context_matches_splice_next
        (post-fix 状态)
      - scripts/fiber-morph-devnet-acceptance.sh
      - scripts/devnet-stateful-scenarios.sh
      - crates/morph-cli/src/hub.rs (新改的)
      - ui/morph-hub/src/api.ts (新改的)
      - git log 5072d81^..5072d81 --stat (这次 fix commit 改了什么)
      - git diff 5072d81 --stat (dirty 改了什么)
      - git diff 5072d81 -- crates/morph-cli/src/hub.rs ui/morph-hub/src/

      ## 输出文件
      docs/swarm-audit-W6-safety.md

      ## 输出格式
      1. 元数据
      2. Executive Summary: 给出安全态势评级 (Acceptable-for-devnet / Acceptable-with-caveats /
         Not-yet-acceptable 三档),3 个最关键残余风险
      3. Threat Model: 信任假设清单 + 攻击者模型清单
      4. Attack Surface Matrix: 协议路径 × 攻击者类型 (表格)
      5. Post-W5-Closure Recheck: 6/27 关闭项的二次验证 (A-2026-06-27-01..09 全部 9 条)
      6. Findings 表: | Sev | ID | Surface | Threat | Evidence (file:line) | Recommendation |
         ≥ 8 条新增
      7. Reassessed Open Findings: W1-W5 中 open / partially-closed 的 HIGH+CRITICAL 重评估
      8. Residual Risk Ranking: P0/P1/P2 三档,每档 3-5 条
      9. Limitations
      10. Recommended Next Triggers

      ## 停止条件
      - docs/swarm-audit-W6-safety.md 已写入
      - 含以上 10 个章节
      - Executive Summary 第一句给出安全评级
